---
- name: Setup Squid egress + DOCKER-USER firewall
  hosts: web
  remote_user: ubuntu

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_host_key_checking: false
    # Role defaults detect these from facts; override only if needed:
    # squid_proxy_bind_ip: 172.17.0.1
    # egress_interface: eth0
    allowed_external: []
    # Example direct DB allow:
    # allowed_external:
    #   - cidr: 10.106.0.0/20
    #     proto: tcp
    #     port: 5432

  roles:
    - egress
